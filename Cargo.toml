[package]
name = "email-sequencing-cli"
version = "0.1.0"
edition = "2024"
description = "Local-first email sequence planning and execution-state CLI"
license-file = "LICENSE"
repository = "https://github.com/wisent-ai/email-sequencing-cli"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
